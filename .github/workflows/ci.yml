# Prüfungen, die bei jedem Push auf einem fremden Rechner laufen (Etappe 20).
#
# Warum "fremder Rechner" der eigentliche Punkt ist: Auf dem eigenen Laptop
# läuft es immer — dort sind Pakete installiert, Zwischendateien vorhanden und
# Pfade gewachsen. Die CI startet mit einem leeren System und nur dem, was im
# Repository liegt. Sie ist damit die einzige ehrliche Antwort auf die Frage, ob
# das Projekt bei jemand anderem anläuft.
#
# Zwei Abläufe, bewusst getrennt:
#
#   qualitaet  — installieren, prüfen, testen. Läuft ohne Rohdaten, weil die
#                nicht im Repository liegen (CC-BY-Material gehört nicht in ein
#                Codearchiv). Tests, die Daten brauchen, überspringen sich
#                selbst: 67 laufen, 41 melden sich ab.
#   pipeline    — holt die Rohdaten, prüft ihren Hash und rechnet die ganze
#                Kette durch. Erst hier laufen alle 108 Tests.
#
# Der zweite Ablauf wartet auf den ersten (needs:). Es hat keinen Sinn, Daten zu
# holen und ein Modell zu trainieren, wenn schon die Formatierung nicht stimmt.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # von Hand startbar, über die Oberfläche

# Bei mehreren Pushes hintereinander zählt nur der letzte. Spart Laufzeit und
# verhindert, dass ein älterer Lauf einen neueren überholt.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Prüfung ──────────────────────────────────────────────────────────
  qualitaet:
    name: Prüfung (Python ${{ matrix.python }})
    runs-on: ubuntu-latest

    strategy:
      # fail-fast: false, damit man sieht, ob ein Fehler alle Versionen
      # betrifft oder nur eine. Bricht man beim ersten ab, weiß man das nicht.
      fail-fast: false
      matrix:
        # Die Untergrenze aus pyproject.toml (3.10), die Version der CI-Beispiele
        # (3.11) und die der Entwicklungsumgebung (3.13). Dass alle drei laufen,
        # ist die Zusage von requires-python = ">=3.10".
        python: ["3.10", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      # requirements.txt endet mit "-e ." — das Projekt selbst wird also
      # mitinstalliert, und "from src...." funktioniert ohne PYTHONPATH.
      - name: Pakete installieren
        run: python -m pip install -r requirements.txt

      - name: ruff — statische Prüfung
        run: ruff check src tests scripts

      - name: ruff — Formatierung
        run: ruff format --check src tests scripts

      # Ohne Rohdaten. Die Tests, die Daten oder ein Modell brauchen,
      # überspringen sich selbst (-rs zeigt, welche und warum).
      - name: Tests
        run: pytest -rs

  # ── Kette ────────────────────────────────────────────────────────────
  pipeline:
    name: Kette von den Rohdaten zum Modell
    runs-on: ubuntu-latest
    needs: qualitaet

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Pakete installieren
        run: python -m pip install -r requirements.txt

      # Der Schlüssel ist der eingefrorene SHA-256 aus params.yaml. Ändert sich
      # der Hash, greift der Zwischenspeicher nicht mehr und die Datei wird neu
      # geholt — genau richtig, denn dann ist es eine andere Datei.
      - name: Hash der Rohdaten lesen
        id: daten
        run: echo "sha=$(grep -oE '[0-9a-f]{64}' params.yaml | head -1)" >> "$GITHUB_OUTPUT"

      - name: Rohdaten aus dem Zwischenspeicher
        id: speicher
        uses: actions/cache@v4
        with:
          path: data/raw
          key: rohdaten-${{ steps.daten.outputs.sha }}

      # Nur bei leerem Zwischenspeicher. Das Skript prüft den SHA-256 gegen
      # params.yaml und bricht bei Abweichung ab: Hat die Quelle die Datei
      # verändert, ist keine bisherige Kennzahl mehr vergleichbar, und das soll
      # die CI rot melden statt stillschweigend weiterrechnen.
      - name: Rohdaten holen
        if: steps.speicher.outputs.cache-hit != 'true'
        run: python scripts/fetch_data.py

      - name: Rohdaten prüfen
        run: python -m src.data.load

      - name: Kette durchrechnen
        run: python -m src.pipelines.run_pipeline --no-mlflow

      # Jetzt liegen Teilmengen, Modell und Referenzstichprobe vor — erst
      # hier können alle Tests laufen, auch die mit "langsam" markierten.
      - name: Alle Tests, mit Daten
        run: pytest -rs

      # Die Selbstprüfung aus Etappe 18: Kontrollfall muss ruhig bleiben, alle
      # drei Driftszenarien müssen erkannt werden. Sonst Rückgabewert 1.
      - name: Überwachung nachweisen
        run: python -m src.monitoring.simulate_drift

      # Die Kennzahlen in die Zusammenfassung des Laufs schreiben. Damit steht
      # das Ergebnis direkt auf der Übersichtsseite, ohne Protokolle zu öffnen.
      - name: Kennzahlen in die Zusammenfassung
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          pfad = Path("reports/pipeline_run.json")
          if not pfad.exists():
              print("Kein Manifest — die Kette ist nicht durchgelaufen.")
              raise SystemExit(0)

          m = json.loads(pfad.read_text(encoding="utf-8"))
          k = m.get("metrics") or {}
          print("## Ergebnis der Kette\n")
          print(f"**Zustand:** {m['status']}  ·  **Dauer:** {m['duration_s']} s\n")
          print("| Kennzahl | Wert |")
          print("|---|---|")
          def vier(wert):
              return f"{wert:.4f}" if isinstance(wert, float) else wert

          for name, wert in (
              ("PR-AUC", vier(k.get("pr_auc"))),
              ("Recall", vier(k.get("recall"))),
              ("Precision", vier(k.get("precision"))),
              ("Erwartete Kosten", f"{k.get('kosten_eur', 0):,.0f} EUR".replace(",", ".")),
              ("Schwellenwert", k.get("schwelle")),
              ("Qualitätsschranke", "bestanden" if m.get("quality_gate", {}).get("passed")
               else "NICHT BESTANDEN"),
          ):
              print(f"| {name} | {wert} |")
          print("\n### Herkunft\n")
          print("| | |")
          print("|---|---|")
          for name, schluessel in (("Rohdaten SHA-256", "raw_data_sha256"),
                                   ("params.yaml SHA-256", "params_sha256"),
                                   ("Git-Commit", "git_commit"),
                                   ("Startwert", "seed")):
              print(f"| {name} | `{m['provenance'][schluessel]}` |")
          print(f"| Modell SHA-256 | `{m.get('model_sha256')}` |")
          PY

      # Das Modell an den nächsten Ablauf weitergeben. So baut der Container
      # genau das Modell ein, das dieser Lauf erzeugt und geprüft hat — und
      # nicht eines, das jemand von Hand dazugelegt hat. Das ist die Kette, die
      # eine Auslieferung nachvollziehbar macht.
      - name: Modell als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: models/model.joblib
          retention-days: 7

      # Die Belege des Laufs mitnehmen: Manifest, Kennzahlen, Driftberichte.
      # 90 Tage sind die Voreinstellung; 30 genügen und sparen Platz.
      - name: Berichte mitnehmen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: berichte-${{ github.sha }}
          path: |
            reports/
            data/processed/reference_sample.csv
          retention-days: 30

  # ── Container ────────────────────────────────────────────────────────
  # Das ist die Auslieferung dieses Projekts (Etappe 21): ein gebautes und
  # geprüftes Abbild. Nicht ein Deployment — was dafür fehlt, steht im README.
  container:
    name: Abbild bauen und prüfen
    runs-on: ubuntu-latest
    needs: pipeline

    steps:
      - uses: actions/checkout@v4

      # Das Modell kommt aus dem vorigen Ablauf, nicht aus dem Repository
      # (dort liegt es nicht) und nicht aus einem frischen Training (dann wäre
      # es ein anderes als das geprüfte).
      - name: Modell aus dem Pipelinelauf holen
        uses: actions/download-artifact@v4
        with:
          name: modell-${{ github.sha }}
          path: models

      - name: Hash des Modells festhalten
        id: modell
        run: echo "sha=$(sha256sum models/model.joblib | cut -d\  -f1)" >> "$GITHUB_OUTPUT"

      - name: Abbild bauen
        run: docker build -f Dockerfile.api -t pdm-api:${{ github.sha }} .

      - name: Container starten
        run: docker run -d --name pdm-api -p 8000:8000 pdm-api:${{ github.sha }}

      # Nicht blind schlafen, sondern den HEALTHCHECK des Abbilds abwarten.
      # Damit ist auch geprüft, dass der Haken im Dockerfile funktioniert.
      - name: Auf "healthy" warten
        run: |
          for i in $(seq 1 30); do
            zustand=$(docker inspect --format '{{.State.Health.Status}}' pdm-api)
            echo "  Zustand: $zustand"
            [ "$zustand" = "healthy" ] && break
            sleep 2
          done
          test "$zustand" = "healthy"

      - name: /health abfragen
        run: curl -fsS http://localhost:8000/health

      - name: /predict abfragen
        run: |
          curl -fsS -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"type":"L","air_temperature_k":302.0,"process_temperature_k":310.5,
                 "rotational_speed_rpm":1320,"torque_nm":64.0,"tool_wear_min":215}'

      # Die Probe aufs Ganze: Antwortet im Container genau das Modell, das die
      # Kette erzeugt hat? /model-info nennt seinen SHA-256 — er muss mit dem
      # Hash des Artefakts übereinstimmen.
      - name: Modell im Container ist das geprüfte
        run: |
          im_container=$(curl -fsS http://localhost:8000/model-info \
            | python -c "import sys, json; print(json.load(sys.stdin)['model_sha256'])")
          echo "  Artefakt:    ${{ steps.modell.outputs.sha }}"
          echo "  im Container: $im_container"
          test "$im_container" = "${{ steps.modell.outputs.sha }}"

      - name: Abbild in die Zusammenfassung
        if: always()
        run: |
          {
            echo "## Abbild"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Marke | \`pdm-api:${{ github.sha }}\` |"
            echo "| Größe | $(docker image ls pdm-api:${{ github.sha }} --format '{{.Size}}') |"
            echo "| Modell SHA-256 | \`${{ steps.modell.outputs.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Protokoll des Containers
        if: always()
        run: docker logs pdm-api

      - name: Aufräumen
        if: always()
        run: docker rm -f pdm-api
